name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # envied needs a .env file to generate env.g.dart; CI never has real
      # secrets, so a placeholder is enough for analyze/test (which do not
      # exercise a live Supabase project).
      - name: Create placeholder .env for codegen
        run: cp .env.example .env

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test
